name: Deploy replay site to GitHub Pages

# Builds web/ (the 🔵 replay + de-correlation site) and publishes dist-web/ to GitHub Pages.
# ◆S4 prep (wk9-10): this workflow is ready to run, but a real deploy needs a one-time manual step
# the repo owner must do (not something this workflow or an agent can safely do unattended):
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
# Until that's flipped, this workflow has no effect (Pages isn't listening for its output). It is
# safe to merge before that toggle — it simply won't publish anything until enabled.
#
# vite.config.ts (web/) already sets base:"./" so the build works at ANY subpath — verified via
# `npm run deploy:check` (scripts/serve-subpath-sim.mjs) simulating the exact
# https://<user>.github.io/<repo>/ hosting pattern before this workflow was written.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
