name: Deploy replay site to GitHub Pages

# Builds web/ (the 🔵 replay + de-correlation site) and publishes dist-web/ to GitHub Pages.
# ◆S4 prep (wk9-10): this workflow is ready to run, but a real deploy needs a one-time manual step
# the repo owner must do (not something this workflow or an agent can safely do unattended):
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
# Until that's flipped, this workflow has no effect (Pages isn't listening for its output). It is
# safe to merge before that toggle — it simply won't publish anything until enabled.
#
# vite.config.ts (web/) already sets base:"./" so the build works at ANY subpath — verified via
# `npm run deploy:check` (scripts/serve-subpath-sim.mjs) simulating the exact
# https://<user>.github.io/<repo>/ hosting pattern before this workflow was written.

on:
  push:
    branches: [main]
    # Only redeploy when something that actually affects the built site changed. bench/
    # orchestration/ and top-level docs (README, design/) churn constantly across the other
    # lines' rounds and must not burn a Pages deploy each time.
    paths:
      - "web/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue instead of cancel: a canceled mid-upload deploy can leave Pages serving a partial
  # artifact. With two lines pushing to main in the same window, queuing (not racing) is what
  # keeps the live site always fully one commit or the other, never a torn state.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Occasionally fails with GitHub's own "Deployment failed, try again later" — a transient
      # Pages-backend lock, unrelated to build content (build job above already succeeded).
      # Re-run failed jobs from the Actions tab; it has cleared on the very next attempt every
      # time this has been observed.
      - id: deployment
        uses: actions/deploy-pages@v4
